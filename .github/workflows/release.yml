name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/check_consistency.py
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/install.py scripts/check_consistency.py
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          [[ "$tag" == v* ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify version and baseline artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.release.outputs.tag }}"
          expected="${expected#v}"
          test "$expected" = "$(tr -d '\r\n' < VERSION)"
          test -s README.md
          test -s docs/INTEGRATION.md
          test -s docs/COMPATIBILITY.md
          test -s docs/INSTALL.th.md
          test -s "docs/releases/v${expected}.md"
          test -s templates/AGENTS.ecosystem.md
          test -s skills/staged-capability-loop/SKILL.md
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          name="cogentnexus-ecosystem-$tag"
          stage="$RUNNER_TEMP/$name"
          out="$RUNNER_TEMP/release"
          mkdir -p "$stage" "$out"
          rsync -a --exclude '.git/' --exclude '__pycache__/' ./ "$stage/"
          tar -C "$RUNNER_TEMP" -czf "$out/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && zip -qr "$out/$name.zip" "$name")
          (cd "$out" && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          name="cogentnexus-ecosystem-$tag"
          notes="docs/releases/$tag.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing duplicate publication."
            exit 1
          fi
          files=(
            "$RUNNER_TEMP/release/$name.tar.gz"
            "$RUNNER_TEMP/release/$name.zip"
            "$RUNNER_TEMP/release/SHA256SUMS.txt"
          )
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$tag" "${files[@]}" --verify-tag --notes-file "$notes" --title "CogentNexus Ecosystem $tag"
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --notes-file "$notes" --title "CogentNexus Ecosystem $tag"
          fi
